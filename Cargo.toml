[package]
name = "monkeytype-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native pixel-rendered Monkeytype rewrite for Kitty graphics terminals"
license = "GPL-3.0-or-later"
include = ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "LICENSE", "NOTICE", "README.md"]

[dependencies]
base64 = "0.22"
# The level-triggered TTY backend preserves input readiness when resize and
# keyboard events arrive together; covered by tools/smoke_pty.py.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
flate2 = "1"
fontdue = "0.9"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
